[package]
name = "trailboss"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace]
members = ["crates/trailboss-runtime", "crates/ghostty-vt"]
resolver = "2"

[dependencies]
trailboss-runtime = { path = "crates/trailboss-runtime" }
crossterm = "0.29"
serde_json = "1"
unicode-width = "0.2.2"
tracing = "0.1"

[dev-dependencies]
ghostty-vt = { path = "crates/ghostty-vt" }
jsonschema = { version = "0.58.6", default-features = false }
portable-pty = "=0.9.0"

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
