id = "tommymorgan.agent-tree"
name = "Agent Tree"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Explorer-style workspace and tab tree rendered in the expanded sidebar."
platforms = ["linux", "macos"]

[[actions]]
id = "focus-tab"
title = "Focus tab"
command = ["bun", "agent_tree.ts", "--focus-tab"]

[[actions]]
id = "open-workspace"
title = "Focus or collapse workspace"
command = ["bun", "agent_tree.ts", "--open-workspace"]

[[actions]]
id = "focus-pane"
title = "Focus pane"
command = ["bun", "agent_tree.ts", "--focus-pane"]

[[actions]]
id = "expand-workspace"
title = "Expand space"
command = ["bun", "agent_tree.ts", "--expand-workspace"]

[[actions]]
id = "collapse-workspace"
title = "Collapse space"
command = ["bun", "agent_tree.ts", "--collapse-workspace"]

[[ui]]
id = "tree"
surface = "sidebar"
command = ["bun", "agent_tree.ts", "--watch"]
stream = true
stream_actions = true
