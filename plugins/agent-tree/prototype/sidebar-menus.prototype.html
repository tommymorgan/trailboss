<!doctype html>
<!-- THROWAWAY: three contextual-menu approaches on one route, ?variant=a|b|c. No real Core mutations. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sidebar menus — prototype</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,monospace;background:#100d13;color:#c4bec9}*{box-sizing:border-box}body{margin:0;padding:28px 28px 110px}button,input{font:inherit}button{cursor:pointer}h1{font-size:18px;color:#eee9f1;margin:0 0 8px}.note{color:#92899b;font-size:12px;margin-bottom:22px}.app{display:grid;grid-template-columns:300px 1fr;min-height:650px;border:1px solid #343039;border-radius:8px;overflow:hidden;max-width:1300px;margin:auto;background:#141118}#sidebar{background:#19151d;border-right:1px solid #343039;min-height:650px}.main{display:flex;flex-direction:column;min-width:0}.session{padding:12px 18px;border-bottom:1px solid #343039;color:#8d8298;font-size:12px}.panes{display:grid;grid-template-columns:1fr 1fr;flex:1;gap:1px;background:#343039}.pane{background:#100d13;padding:18px;min-height:210px;font-size:13px;overflow:auto}.pane.active{box-shadow:inset 2px 0 #617fbc}.pane header{color:#8d8298;border-bottom:1px solid #27232e;padding-bottom:10px;margin-bottom:18px}.pane pre{white-space:pre-wrap;color:#bdb3c6;line-height:1.65;margin:0}.status{padding:12px 18px;border-top:1px solid #343039;font-size:12px;color:#a094af}details{max-width:1300px;margin:18px auto;font-size:12px;color:#8d8298}#state{white-space:pre-wrap;font-size:11px;max-height:250px;overflow:auto}.switcher{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:15px;padding:10px 14px;border:1px solid #756587;border-radius:30px;background:#272032;box-shadow:0 8px 30px #0009;z-index:10000;font-size:13px;color:#eee9f1}.switcher button{background:#3d314b;border:0;border-radius:50%;color:#eee9f1;width:32px;height:32px}.hint{max-width:1300px;margin:12px auto;color:#a99bb7;font-size:12px}@media(max-width:750px){body{padding:12px 8px 100px}.app{grid-template-columns:240px 1fr}.panes{grid-template-columns:1fr}.pane{min-height:140px}}
.pane:last-child:nth-child(odd){grid-column:1/-1}
.app{max-width:100ch;grid-template-columns:minmax(0,1fr) minmax(0,3fr)}
</style></head><body>
<h1>Quiet sidebar · contextual menus</h1><div class="note">Throwaway preview. Actions change this page's memory only; real sessions stay untouched.</div>
<div class="app"><aside id="sidebar" aria-label="Session sidebar"></aside><main class="main"><div class="session">spike · 15 panes · sidebar-only chrome</div><div class="panes" id="panes"></div><div class="status" id="status" role="status"></div></main></div>
<div class="hint" id="hint"></div><details open><summary>Live prototype state</summary><pre id="state"></pre></details>
<nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><span id="variant-label"></span><button id="next" aria-label="Next variant">→</button></nav>
<script type="module">
import {mountContext,mountHover} from './context-hover.prototype.js';
import {mountPalette} from './palette.prototype.js';
const variants=['a','b','c'], names={a:'Right-click menus',b:'Reveal on interaction',c:'Scoped action palette'};
const hints={a:'Right-click a space or tab. Keyboard: focus a row, then Shift+F10. Right-click empty sidebar for session actions.',b:'Hover or focus a row to reveal its menu. New tab lives in the space menu.',c:'Ctrl+K: session palette. Focus a space and press Shift+F10: that space’s actions.'};
let seq=20,cleanup=()=>{};let variant=new URL(location.href).searchParams.get('variant')||'b';if(!variants.includes(variant))variant='b';
const state={spaces:['trailboss','signalchain','notes'].map((name,w)=>({id:`space${w}`,name,tabs:['Build','Review'].map((name,t)=>({id:`tab${w}-${t}`,name,panes:Array.from({length:t?2:3},(_,p)=>({id:`pane${w}-${t}-${p}`,name:['omp','shell','logs'][p],status:['working','waiting','idle'][(w+t+p)%3]}))}))})),selectedSpace:'space0',selectedTab:'tab0-0',selectedPane:'pane0-0-0',detached:false};
globalThis.prototypeState=state;
const node=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
function select(spaceId,tabId,paneId){const space=state.spaces.find(s=>s.id===spaceId);if(!space)return;const tab=space.tabs.find(t=>t.id===tabId)||space.tabs[0];state.selectedSpace=space.id;state.selectedTab=tab?.id||null;state.selectedPane=(tab?.panes.find(p=>p.id===paneId)||tab?.panes[0])?.id||null;state.collapsedSpaces=(state.collapsedSpaces||[]).filter(id=>id!==spaceId);state.detached=false;render();}
function action(name,spaceId,tabId){const space=state.spaces.find(s=>s.id===spaceId);if(name==='new-space'){const id=`space${seq++}`,tab=`tab${seq++}`,pane=`pane${seq++}`;state.spaces.push({id,name:`New space ${state.spaces.length+1}`,tabs:[{id:tab,name:'Shell',panes:[{id:pane,name:'shell',status:'idle'}]}]});select(id);return}if(name==='detach'){state.detached=true;render();return}if(!space)return;if(name==='new-tab'){const id=`tab${seq++}`,pane=`pane${seq++}`;space.tabs.push({id,name:`New tab ${space.tabs.length+1}`,panes:[{id:pane,name:'shell',status:'idle'}]});select(space.id,id);return}if(name==='rename-space'){const next=prompt('Rename space',space.name);if(next?.trim())space.name=next.trim()}if(name==='close-tab'){space.tabs=space.tabs.filter(t=>t.id!==tabId);if(state.selectedTab===tabId){select(space.id);return}}render();}
const api={select,action,refresh:()=>render()};
function render(){cleanup();const root=document.querySelector('#sidebar');root.replaceChildren();cleanup=({a:mountContext,b:mountHover,c:mountPalette}[variant])(root,state,api)||(()=>{});document.querySelector('#variant-label').textContent=`${variant.toUpperCase()} · ${names[variant]}`;document.querySelector('#hint').textContent=hints[variant];const space=state.spaces.find(s=>s.id===state.selectedSpace),tab=space?.tabs.find(t=>t.id===state.selectedTab);const panes=document.querySelector('#panes');panes.replaceChildren();for(const p of tab?.panes||[]){const panel=node('section','');panel.className='pane'+(p.id===state.selectedPane?' active':'');panel.append(node('header',`${p.name} · ${p.status}`));panel.append(node('pre',p.name==='omp'?'$ omp\n\nAdding timing measurements\n\nCore → client → renderer\n\nContextual-menu prototype running independently.':p.name==='logs'?'$ tail -f render.log\n\nrender.start\nrender.end\n\n15 pane surfaces remain populated.':'$ pwd\n~/src/'+(space?.name||'')+'\n\n$ git status --short\n\n$ █'));panes.append(panel)}if(!tab||state.detached){panes.replaceChildren(node('div',state.detached?'Detached in preview. Select a space to reattach.':'No tabs in this space. Open its contextual menu to create one.'))}document.querySelector('#status').textContent=state.detached?'Preview detached · Core session would stay alive':`${space?.name||'No space'} / ${tab?.name||'No tab'} · ${state.spaces.reduce((n,s)=>n+s.tabs.reduce((m,t)=>m+t.panes.length,0),0)} panes`;document.querySelector('#state').textContent=JSON.stringify(state,null,2)}
function cycle(delta){variant=variants[(variants.indexOf(variant)+delta+variants.length)%variants.length];const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render()}
document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,[contenteditable], [role="dialog"], [role="menu"]')||document.querySelector('[role="dialog"], [role="menu"]'))return;if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();cycle(event.key==='ArrowRight'?1:-1)}});addEventListener('popstate',()=>{variant=new URL(location.href).searchParams.get('variant')||'a';if(!variants.includes(variant))variant='a';render()});render();
</script></body></html>
